<!doctype html>
<html lang="{{ site.Language.Locale | default "fr" }}" data-skin="{{ (partialCached "skins.html" . "skins").default }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  {{ partial "header.html" . }}
  <main id="contenu" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
