{{- /* Sélecteur de skin, affiché seulement s'il y a plusieurs skins. Caché tant que js/skin.js ne l'a pas activé. */ -}}
{{- $skins := (partialCached "skins.html" . "skins").list }}
{{- if gt (len $skins) 1 }}
<p class="skin-switcher" id="skin-switcher" hidden>
  <label for="skin-select">Apparence du site</label>
  <select id="skin-select">
    {{- range $skins }}
    <option value="{{ .name }}">{{ .label }}</option>
    {{- end }}
  </select>
</p>
{{- end }}
