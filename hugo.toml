# Magie du Chaos — configuration Hugo
baseURL = "https://magieduchaos.org/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Magie du Chaos"
timeZone = "Europe/Zurich"
enableRobotsTXT = true
summaryLength = 45

# Skins chargés. Chacun se déclare (libellé, couleurs, polices) dans son propre hugo.toml
# et charge le socle commun "base". Avec plusieurs skins, le visiteur choisit l'apparence
# dans le pied de page ; son choix est mémorisé dans son navigateur (localStorage).
# Build avec un seul skin, sans sélecteur :
#   hugo --theme kawaii
#   hugo --theme base                (socle seul, sans habillage)
theme = ["cthulhu", "chaos-dark", "kawaii", "baphomet"]

[params]
  description = "Site officiel francophone des Illuminates of Thanateros"
  # Skin affiché par défaut, et pour les visiteurs sans JavaScript (doit figurer dans theme)
  defaultSkin = "chaos-dark"
  # Apparence tirée au sort à chaque changement de page (jamais deux fois de suite la même) :
  #   "off"     désactivé
  #   "option"  proposé dans le sélecteur (« Au hasard à chaque page »), choix du visiteur
  #   "default" proposé, et actif d'office pour les nouveaux visiteurs
  # Sans effet avec un seul skin ; les visiteurs sans JavaScript voient toujours defaultSkin.
  randomSkin = "default"
  # Formulaires Tally : ID seul (PR1YoP) ou URL complète (https://tally.so/r/PR1YoP)
  [params.tally]
    renseignements = "QoevLk"
    adhesion = "PR1YoP"

[pagination]
  pagerSize = 10

# URL identiques à l'ancien WordPress
[permalinks]
  [permalinks.page]
    posts = "/:year/:month/:day/:slug/"
  [permalinks.section]
    posts = "/blog/"

# Les deux axes de catégories de l'ancien site
[taxonomies]
  type_ecrit = "types"
  source = "sources"

[menus]
  [[menus.main]]
    name = "Accueil"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Temple"
    pageRef = "/temple"
    weight = 20
  [[menus.main]]
    name = "Adhésion"
    pageRef = "/adhesion"
    weight = 30
  [[menus.main]]
    name = "Blog"
    pageRef = "/posts"
    weight = 40
  [[menus.main]]
    name = "Liens"
    pageRef = "/liens"
    weight = 50
  [[menus.main]]
    name = "Livres"
    pageRef = "/livres"
    weight = 60

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # contenu maîtrisé : <u>, <sub> issus de WordPress
  [markup.goldmark.extensions.typographer]
    disable = true         # garder la ponctuation telle qu'écrite

[services.rss]
  limit = 20

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html"]
  term = ["html", "rss"]
