# Construit le site avec Hugo et le publie sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings → Pages → Source = « GitHub Actions ».
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0        # même version qu'en local
      HUGO_ENVIRONMENT: production
      TZ: Europe/Zurich
    steps:
      - name: Installer Hugo extended
        run: |
          curl -sSLo "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${{ runner.temp }}/hugo"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${{ runner.temp }}/hugo" hugo
          echo "${{ runner.temp }}/hugo" >> "$GITHUB_PATH"

      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Construire le site
        # baseURL vient de hugo.toml (https://magieduchaos.org/).
        # Pour un autre skin : ajouter par ex. --theme kawaii
        run: hugo --gc --minify --cleanDestinationDir

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
